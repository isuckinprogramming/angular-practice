<li class="bg-white mb-3">
  <div
    data-mdb-input-init
    class="form-outline"
  >
    <textarea
      class="form-control bg-body-tertiary"
      id="messageInput"
      rows="4"
      name="messageSendInput"
      [(ngModel)]="messageSendInput"
    >

    </textarea>
    <label
      class="form-label"
      for="sendMessageInput"
      >
      Message
    </label>
  </div>
<button
  type="button"
  data-mdb-button-init
  data-mdb-ripple-init
  class="btn btn-info btn-rounded float-end"
  (click)="sendMessage()"
>
  Send
</button>

</li>
